[project]
name = "p99-runtime"
version = "0.1.0"
description = "Local open-source P99 voice runtime (ASR → LLM → TTS over WebSocket)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "P99 Labs" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "numpy>=1.26.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
# Heavy ML backends — install what you need for local inference.
ml = []
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
p99-runtime = "p99_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p99_runtime"]
