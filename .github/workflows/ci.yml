name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime (editable)
        run: pip install -e './runtime[dev]'

      - name: Runtime tests
        run: pytest runtime/tests -q
