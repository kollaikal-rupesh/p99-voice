<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P99 Voice Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a1814;
        --paper: #f4efe6;
        --accent: #c2491c;
        --muted: #7a7268;
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f4efe6;
          --paper: #141210;
          --muted: #a8a394;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(420px, 100%);
        display: grid;
        gap: 1.25rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p.sub {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }
      button {
        appearance: none;
        border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
        background: var(--ink);
        color: var(--paper);
        border-radius: 999px;
        padding: 0.85rem 1.25rem;
        font: inherit;
        font-weight: 550;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--ink);
      }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      #state {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--accent);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #log {
        min-height: 8rem;
        max-height: 16rem;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font-size: 0.9rem;
        line-height: 1.5;
        background: color-mix(in srgb, var(--ink) 3%, transparent);
      }
      #log .user { color: var(--muted); }
      #log .agent { color: var(--ink); }
      #stats {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>P99 Voice Agent</h1>
        <p class="sub">
          Open-source client. Point it at a local runtime or P99 cloud —
          same protocol either way.
        </p>
      </div>
      <div id="state">idle</div>
      <div class="row">
        <button id="connect">Connect mic</button>
        <button id="disconnect" class="secondary" disabled>Disconnect</button>
      </div>
      <div id="log" aria-live="polite"></div>
      <div id="stats"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
